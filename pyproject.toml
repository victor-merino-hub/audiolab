[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audiolab"
version = "0.1.0"
description = "Audio signal processing and machine learning for hearables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Victor Merino" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "librosa",
    "soundfile",
    "sounddevice",
    "scikit-learn",
    "torch",
    "pystoi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
]
# PESQ needs a C compiler to install (no Windows wheels): pip install -e ".[pesq]" on Linux or Colab
pesq = [
    "pesq",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside librosa.effects.time_stretch itself, not by our code
    "ignore:The `.*` parameter is deprecated:FutureWarning",
]
